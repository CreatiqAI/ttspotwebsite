const pages=[...document.querySelectorAll('[data-page]')];function openPage(name){pages.forEach(p=>{p.hidden=p.dataset.page!==name;p.classList.toggle('active',!p.hidden)});document.querySelectorAll('.dock [data-open]').forEach(b=>b.setAttribute('aria-current',b.dataset.open===name?'page':'false'))}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPage(b.dataset.open));document.querySelectorAll('.art').forEach(b=>b.onclick=()=>openPage('music'));
let callTimer;document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>{clearTimeout(callTimer);document.querySelector('.call-message').textContent='Calling '+b.dataset.call+'… (demo)';document.querySelector('#end-call').hidden=false;callTimer=setTimeout(()=>document.querySelector('.call-message').textContent='Connected to '+b.dataset.call+' · Demo only',1100)});document.querySelector('#end-call').onclick=()=>{clearTimeout(callTimer);document.querySelector('.call-message').textContent='Demo call ended';document.querySelector('#end-call').hidden=true};
let playing=false;const slider=document.querySelector('.timeline');
function paintPlay(){document.querySelectorAll('[data-play]').forEach(b=>{b.innerHTML=playing?'<img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiIgZmlsbD0iI2ZmZmZmZiIgY2xhc3M9ImJpIGJpLXBhdXNlLWZpbGwiIHZpZXdCb3g9IjAgMCAxNiAxNiI+CiAgPHBhdGggZD0iTTUuNSAzLjVBMS41IDEuNSAwIDAgMSA3IDV2NmExLjUgMS41IDAgMCAxLTMgMFY1YTEuNSAxLjUgMCAwIDEgMS41LTEuNW01IDBBMS41IDEuNSAwIDAgMSAxMiA1djZhMS41IDEuNSAwIDAgMS0zIDBWNWExLjUgMS41IDAgMCAxIDEuNS0xLjUiLz4KPC9zdmc+DQo=" alt="">':'<img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiIgZmlsbD0iI2ZmZmZmZiIgY2xhc3M9ImJpIGJpLXBsYXktZmlsbCIgdmlld0JveD0iMCAwIDE2IDE2Ij4KICA8cGF0aCBkPSJtMTEuNTk2IDguNjk3LTYuMzYzIDMuNjkyYy0uNTQuMzEzLTEuMjMzLS4wNjYtMS4yMzMtLjY5N1Y0LjMwOGMwLS42My42OTItMS4wMSAxLjIzMy0uNjk2bDYuMzYzIDMuNjkyYS44MDIuODAyIDAgMCAxIDAgMS4zOTMiLz4KPC9zdmc+DQo=" alt="">';b.setAttribute('aria-label',playing?'Pause music':'Play music')})}
function sendMusic(action,value){parent.postMessage({type:'ttspot-audio-command',action,value},location.origin)}
document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>sendMusic('toggle'));
document.querySelectorAll('[data-skip]').forEach(b=>{b.setAttribute('aria-label','Restart track');b.onclick=()=>sendMusic('restart')});
slider.oninput=()=>sendMusic('seek',Number(slider.value));
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='ttspot-audio-state')return;playing=e.data.playing;paintPlay();slider.max=e.data.duration||1;slider.value=e.data.time||0;document.querySelector('.hint').textContent=e.data.blocked?'Tap play to start music':e.data.error?'Music unavailable. Tap play to retry.':'The Hills · Full TikTok Remix';});
sendMusic('state');
document.addEventListener('keydown',e=>{if(e.key==='Escape')openPage('dashboard')});
